<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="La ruta del loader en cuatro fases">
  <rect width="900" height="320" fill="#0b0f1c"/>
  <text x="24" y="32" font-family="Consolas,monospace" font-size="16" fill="#00e5ff">La ruta del loader: 4 fases, 13 pasos</text>

  <rect x="24" y="60" width="196" height="92" rx="10" fill="#101a22" stroke="#00e5ff"/>
  <text x="38" y="86" font-family="Consolas,monospace" font-size="13" fill="#00e5ff">1. LEER</text>
  <text x="38" y="110" font-family="Consolas,monospace" font-size="11" fill="#c9d1e0">pasos 1-4</text>
  <text x="38" y="130" font-family="Consolas,monospace" font-size="10" fill="#8b93b8">MZ, NT, secciones</text>

  <rect x="238" y="60" width="196" height="92" rx="10" fill="#101a22" stroke="#39ff14"/>
  <text x="252" y="86" font-family="Consolas,monospace" font-size="13" fill="#39ff14">2. MAPEAR</text>
  <text x="252" y="110" font-family="Consolas,monospace" font-size="11" fill="#c9d1e0">pasos 5-7</text>
  <text x="252" y="130" font-family="Consolas,monospace" font-size="10" fill="#8b93b8">reservar, copiar, relocs</text>

  <rect x="452" y="60" width="196" height="92" rx="10" fill="#101a22" stroke="#f59e0b"/>
  <text x="466" y="86" font-family="Consolas,monospace" font-size="13" fill="#f59e0b">3. RESOLVER</text>
  <text x="466" y="110" font-family="Consolas,monospace" font-size="11" fill="#c9d1e0">pasos 8-11</text>
  <text x="466" y="130" font-family="Consolas,monospace" font-size="10" fill="#8b93b8">imports, .pdata, protect</text>

  <rect x="666" y="60" width="210" height="92" rx="10" fill="#101a22" stroke="#ef4444"/>
  <text x="680" y="86" font-family="Consolas,monospace" font-size="13" fill="#ef4444">4. EJECUTAR</text>
  <text x="680" y="110" font-family="Consolas,monospace" font-size="11" fill="#c9d1e0">pasos 12-13</text>
  <text x="680" y="130" font-family="Consolas,monospace" font-size="10" fill="#8b93b8">entry point + verificar</text>

  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <path d="M220 106 H238"/><path d="M230 100 l8 6 -8 6" fill="#3b82f6" stroke="none"/>
    <path d="M434 106 H452"/><path d="M444 100 l8 6 -8 6" fill="#3b82f6" stroke="none"/>
    <path d="M648 106 H666"/><path d="M658 100 l8 6 -8 6" fill="#3b82f6" stroke="none"/>
  </g>

  <rect x="24" y="184" width="852" height="56" rx="10" fill="#0d1424" stroke="#1c2440"/>
  <text x="40" y="208" font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">Objetivo: entender el trabajo que hace el cargador de Windows.</text>
  <text x="40" y="228" font-family="Consolas,monospace" font-size="11" fill="#8b93b8">Cada fase imprime su resultado: si algo no cuadra, el loader se detiene en vez de adivinar.</text>

  <rect x="24" y="256" width="852" height="42" rx="8" fill="#101a22" stroke="#39ff14"/>
  <text x="40" y="282" font-family="Consolas,monospace" font-size="12" fill="#39ff14">Al final: un PE real se ejecuta sin LoadLibrary, con imports y .pdata resueltos.</text>
</svg>
